name: Verify external audit checkpoint

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: precog-external-audit-checkpoint-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate read-only verification configuration
        env:
          DATABASE_URL: ${{ secrets.PRECOG_DATABASE_URL || secrets.DATABASE_URL }}
          KEY_ID: ${{ vars.PRECOG_PUBLIC_KEY_ID }}
          BUCKET: ${{ vars.PRECOG_AUDIT_S3_BUCKET }}
          ROLE_ARN: ${{ secrets.PRECOG_AUDIT_VERIFY_AWS_ROLE_ARN }}
        run: |
          set -eu
          test -n "$DATABASE_URL" || { echo "::error::Missing PRECOG_DATABASE_URL or DATABASE_URL secret"; exit 1; }
          test -n "$KEY_ID" || { echo "::error::Missing PRECOG_PUBLIC_KEY_ID variable"; exit 1; }
          test -n "$BUCKET" || { echo "::error::Missing PRECOG_AUDIT_S3_BUCKET variable"; exit 1; }
          test -n "$ROLE_ARN" || { echo "::error::Missing PRECOG_AUDIT_VERIFY_AWS_ROLE_ARN secret"; exit 1; }
          test -f "keys/audit/$KEY_ID.pem" || { echo "::error::Public key keys/audit/$KEY_ID.pem is missing"; exit 1; }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.PRECOG_AUDIT_VERIFY_AWS_ROLE_ARN }}
          aws-region: ${{ vars.PRECOG_AWS_REGION || 'us-east-1' }}
      - name: Install verification dependencies
        run: python -m pip install -e ".[dev,postgres,s3]"
      - name: Reconcile PostgreSQL against external evidence
        env:
          DATABASE_URL: ${{ secrets.PRECOG_DATABASE_URL || secrets.DATABASE_URL }}
          PRECOG_CHECKPOINT_BACKEND: s3
          PRECOG_PUBLIC_KEY_ID: ${{ vars.PRECOG_PUBLIC_KEY_ID }}
          PRECOG_PUBLIC_KEY_DIR: keys/audit
          PRECOG_AUDIT_S3_BUCKET: ${{ vars.PRECOG_AUDIT_S3_BUCKET }}
          PRECOG_AUDIT_S3_PREFIX: ${{ vars.PRECOG_AUDIT_S3_PREFIX || 'precog/promotion-audit/checkpoints' }}
          AWS_REGION: ${{ vars.PRECOG_AWS_REGION || 'us-east-1' }}
          PRECOG_MAX_CHECKPOINT_AGE_HOURS: ${{ vars.PRECOG_MAX_CHECKPOINT_AGE_HOURS || '36' }}
          PRECOG_MAX_CHECKPOINT_LAG_EVENTS: ${{ vars.PRECOG_MAX_CHECKPOINT_LAG_EVENTS || '1000' }}
        run: python scripts/checkpoint_promotion_audit.py verify --checkpoint-backend s3
