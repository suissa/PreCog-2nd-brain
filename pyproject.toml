[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "precog-intent-trajectory"
version = "0.1.0"
description = "Provider-neutral Intent Trajectory semantic domain"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["intent_trajectory"]

[project.scripts]
validate-traceability = "scripts.validate_traceability:main"
